<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital | José Moo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            /* Fondo negro sólido y elegante */
            background-color: #050505;
            background-image: 
                linear-gradient(rgba(0, 164, 228, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 164, 228, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            margin: 0; padding: 10px;
            font-family: 'Montserrat', sans-serif; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 400px;
            background: linear-gradient(145deg, rgba(15, 15, 15, 0.95), rgba(5, 5, 5, 0.98));
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 24px; padding: 35px 20px; box-sizing: border-box;
            border: 1px solid rgba(0, 164, 228, 0.2); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(0, 164, 228, 0.05); 
            position: relative; z-index: 10;
        }

        .app-container::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 50%; height: 3px; 
            /* Acento superior en azul y blanco */
            background: linear-gradient(90deg, #005A8C, #FFFFFF, #005A8C);
            border-radius: 0 0 10px 10px; box-shadow: 0 5px 20px rgba(0, 164, 228, 0.5);
        }

        .header { text-align: center; margin-bottom: 30px; }
        
        .logo-wrapper {
            width: 140px; height: 140px; 
            border-radius: 50%; margin: 0 auto; 
            padding: 4px; 
            background: linear-gradient(135deg, #00A4E4 0%, #004481 100%); 
            box-shadow: 0 0 25px rgba(0, 164, 228, 0.3);
            display: flex; justify-content: center; align-items: center;
        }

        .logo-circle {
            width: 100%; height: 100%; border-radius: 50%; 
            background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }

        .virtual-card {
            background: linear-gradient(135deg, #121212 0%, #050505 100%);
            border: 1px solid rgba(0, 164, 228, 0.4);
            border-radius: 18px; padding: 25px; margin-bottom: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(0, 164, 228, 0.1); 
            position: relative; overflow: hidden;
        }

        .vc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .vc-bank { font-size: 16px; font-weight: 800; color: #00A4E4; letter-spacing: 2px; }
        
        .vc-type { font-size: 10px; color: #FFFFFF; text-transform: uppercase; font-weight: 800; letter-spacing: 2px;}
        
        .vc-number-row { text-align: center; margin: 25px 0; }
        .vc-number { 
            font-family: 'Space Mono', monospace; 
            font-size: 18px; 
            color: #FFFFFF; 
            letter-spacing: 2px; 
            white-space: nowrap; 
            text-shadow: 0 0 10px rgba(0, 164, 228, 0.3);
        }
        
        .vc-footer { display: flex; justify-content: space-between; align-items: flex-end; }
        .vc-holder-label { font-size: 8px; color: #888; margin-bottom: 5px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px;}
        .vc-holder-name { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #00A4E4; white-space: nowrap;}
        
        .data-section { padding: 0; border: none; margin-bottom: 25px; }
        .section-title {
            display: inline-block; background-color: #0d0d0d;
            padding: 8px 15px; border-radius: 8px; border-left: 3px solid #00A4E4; 
            font-size: 10px; font-weight: 800; color: #FFFFFF; margin-bottom: 15px; 
            letter-spacing: 1px;
        }
        .section-title i { color: #00A4E4; margin-right: 8px; }
        
        .data-row {
            background: linear-gradient(90deg, #0d0d0d 0%, #151515 100%);
            border: 1px solid rgba(0, 164, 228, 0.15);
            border-radius: 12px; padding: 15px;
            margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.3s ease;
        }
        .data-row:hover { border-color: rgba(0, 164, 228, 0.5); transform: translateX(5px); }
        
        .data-text { display: flex; flex-direction: column; padding-right: 15px; }
        .data-label { font-size: 9px; color: #888; margin-bottom: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .data-value { 
            font-family: 'Space Mono', monospace; 
            font-size: 14px; 
            font-weight: 700; 
            color: #FFFFFF; 
            letter-spacing: 1px;
            word-break: break-all;
        }
        
        .btn-outline-copy {
            background-color: rgba(0, 164, 228, 0.05); color: #00A4E4; border: 1px solid #00A4E4;
            padding: 8px 12px; border-radius: 8px; font-family: 'Montserrat', sans-serif;
            font-weight: 800; font-size: 10px; cursor: pointer; display: flex; 
            align-items: center; gap: 6px; transition: 0.3s; white-space: nowrap; flex-shrink: 0;
        }
        .btn-outline-copy i { font-size: 12px; transition: 0.3s; }
        .btn-outline-copy:hover { background-color: #00A4E4; color: #FFF; border-color: #00A4E4; box-shadow: 0 0 15px rgba(0, 164, 228, 0.4);}
        
        .btn-whatsapp {
            display: flex; justify-content: center; align-items: center; gap: 10px;
            background: linear-gradient(135deg, #005A8C 0%, #00A4E4 100%); 
            color: #FFFFFF; text-decoration: none; 
            padding: 20px; border-radius: 14px; font-size: 13px; font-weight: 800; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid rgba(0, 164, 228, 0.5);
            box-shadow: 0 10px 20px rgba(0, 164, 228, 0.2);
        }
        .btn-whatsapp:hover { transform: scale(1.02); filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="header">
            <div class="logo-wrapper">
                <div class="logo-circle">
                    <img src="https://i.ibb.co/ZRMfPFrN/IMG-20261003-WA0004.jpg" alt="Logo José Moo">
                </div>
            </div>
        </div>

        <div class="virtual-card">
            <div class="vc-header">
                <span class="vc-bank">BBVA</span>
                <span class="vc-type">Débito</span>
            </div>
            <div class="vc-number-row">
                <div class="vc-number">4152 3142 0814 0221</div>
            </div>
            <div class="vc-footer">
                <div>
                    <div class="vc-holder-label">Titular de la cuenta</div>
                    <div class="vc-holder-name">José Moo</div>
                </div>
                <div><i class="fa-brands fa-cc-visa" style="font-size: 26px; color: #FFFFFF; opacity: 0.9;"></i></div>
            </div>
        </div>

        <div class="data-section">
            <div class="section-title"><i class="fa-solid fa-wallet"></i> DATOS DE PAGO</div>

            <div class="data-row">
                <div class="data-text">
                    <span class="data-label">Número de Tarjeta</span>
                    <span class="data-value">4152314208140221</span>
                </div>
                <button class="btn-outline-copy" onclick="copiarTexto('4152314208140221', this)">
                    <i class="fa-regular fa-copy"></i> Copiar
                </button>
            </div>

            <div class="data-row">
                <div class="data-text">
                    <span class="data-label">Cuenta CLABE</span>
                    <span class="data-value">012180015550981967</span>
                </div>
                <button class="btn-outline-copy" onclick="copiarTexto('012180015550981967', this)">
                    <i class="fa-regular fa-copy"></i> Copiar
                </button>
            </div>

            <div class="data-row">
                <div class="data-text">
                    <span class="data-label">Beneficiario</span>
                    <span class="data-value" style="font-family: 'Montserrat', sans-serif; word-break: normal;">Jose Moo</span>
                </div>
                <!-- El texto a copiar no lleva acento para evitar errores bancarios -->
                <button class="btn-outline-copy" onclick="copiarTexto('Jose Moo', this)">
                    <i class="fa-regular fa-copy"></i> Copiar
                </button>
            </div>
        </div>

        <a href="https://wa.me/529991278869?text=Hola%20Jos%C3%A9,%20te%20env%C3%ADo%20mi%20comprobante%20de%20pago" target="_blank" class="btn-whatsapp">
            <i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i> Enviar Comprobante
        </a>
    </div>

    <script>
        function copiarTexto(texto, elemento) {
            navigator.clipboard.writeText(texto).then(() => {
                let textoOriginal = elemento.innerHTML;
                elemento.innerHTML = "<i class='fa-solid fa-check'></i>";
                elemento.style.backgroundColor = "#00A4E4"; 
                elemento.style.borderColor = "#00A4E4";
                elemento.style.color = "#FFFFFF";
                elemento.style.transform = "scale(1.1)";
                
                setTimeout(() => { 
                    elemento.innerHTML = textoOriginal;
                    elemento.style.backgroundColor = "rgba(0, 164, 228, 0.05)"; 
                    elemento.style.borderColor = "#00A4E4";
                    elemento.style.color = "#00A4E4";
                    elemento.style.transform = "scale(1)";
                }, 1500);
            });
        }
    </script>
</body>
</html>
